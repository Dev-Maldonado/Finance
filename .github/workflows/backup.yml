name: Encrypted financial backup

on:
  schedule:
    - cron: '15 2 * * 1-6'
    - cron: '15 2 * * 0'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: finora-production-encrypted-backup
  cancel-in-progress: false

jobs:
  backup:
    if: vars.FINORA_BACKUP_ENABLED == 'true' && github.ref == 'refs/heads/main'
    environment: production-backup
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Prepare isolated PostgreSQL 17 client tools
        run: |
          docker run --detach --rm --name finora-backup-client --cap-drop ALL --security-opt no-new-privileges --read-only --tmpfs /tmp:rw,noexec,nosuid,size=16m --user "$(id -u):$(id -g)" --mount "type=bind,source=$RUNNER_TEMP,target=$RUNNER_TEMP" --entrypoint sh postgres:17-alpine -c 'sleep 1800'
          python3 <<'PY'
          import os
          from pathlib import Path
          folder = Path(os.environ['RUNNER_TEMP']) / 'finora-pg-tools'
          folder.mkdir(mode=0o700)
          variables = ' '.join('--env ' + name for name in ('PGHOST', 'PGPORT', 'PGDATABASE', 'PGUSER', 'PGPASSWORD', 'PGSSLMODE', 'PGCONNECT_TIMEOUT', 'PGAPPNAME', 'PGSSLROOTCERT'))
          for tool in ('psql', 'pg_dump', 'pg_restore'):
              script = folder / tool
              script.write_text('#!/bin/sh\nexec docker exec -i ' + variables + ' finora-backup-client ' + tool + ' "$@"\n')
              script.chmod(0o700)
          PY
          echo "$RUNNER_TEMP/finora-pg-tools" >> "$GITHUB_PATH"
      - name: Create and verify encrypted archive without logging credentials
        env:
          FINORA_BACKUP_PROJECT_REF: ${{ secrets.FINORA_BACKUP_PROJECT_REF }}
          FINORA_BACKUP_PGHOST: ${{ secrets.FINORA_BACKUP_PGHOST }}
          FINORA_BACKUP_PGPORT: ${{ secrets.FINORA_BACKUP_PGPORT }}
          FINORA_BACKUP_PGDATABASE: ${{ secrets.FINORA_BACKUP_PGDATABASE }}
          FINORA_BACKUP_PGUSER: ${{ secrets.FINORA_BACKUP_PGUSER }}
          FINORA_BACKUP_PGPASSWORD: ${{ secrets.FINORA_BACKUP_PGPASSWORD }}
          FINORA_BACKUP_PASSWORD: ${{ secrets.FINORA_BACKUP_PASSWORD }}
          TMPDIR: ${{ runner.temp }}
          PYTHONDONTWRITEBYTECODE: '1'
        run: python3 scripts/backups/scheduled.py --output-dir "$RUNNER_TEMP/finora-encrypted-backups"
      - name: Store only authenticated ciphertext
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: finora-encrypted-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/finora-encrypted-backups/*.tar.gpg
            ${{ runner.temp }}/finora-encrypted-backups/*.tar.gpg.sha256
          retention-days: ${{ github.event.schedule == '15 2 * * 0' && 28 || 7 }}
          if-no-files-found: error
          compression-level: 0
      - name: Remove disposable runner files
        if: always()
        run: |
          docker rm --force finora-backup-client > /dev/null 2>&1 || true
          rm --recursive --force "$RUNNER_TEMP/finora-encrypted-backups" "$RUNNER_TEMP/finora-pg-tools"
