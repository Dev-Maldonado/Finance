name: Daily market and fund data

on:
  schedule:
    - cron: '30 0 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: finora-production-market-sync
  cancel-in-progress: false

jobs:
  sync:
    # An explicit repository variable is required before any production access.
    if: vars.FINORA_SYNC_ENABLED == 'true' && github.ref == 'refs/heads/main'
    environment: production-sync
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Verify private runner configuration
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          node --input-type=module <<'JS'
          const required = ['NEXT_PUBLIC_SUPABASE_URL', 'NEXT_PUBLIC_SUPABASE_ANON_KEY', 'SUPABASE_SERVICE_ROLE_KEY'];
          if (required.some(name => !process.env[name]?.trim())) throw new Error('Configure the required production-sync environment secrets.');
          const url = new URL(process.env.NEXT_PUBLIC_SUPABASE_URL);
          if (url.protocol !== 'https:' || !/^[a-z0-9]{20}\.supabase\.co$/.test(url.hostname)) throw new Error('Use the intended hosted Supabase project URL.');
          if (url.username || url.password || url.search || url.hash || url.pathname !== '/') throw new Error('Supabase URL must contain only the project origin.');
          JS
      - name: Synchronize provider data without a local profile
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          BRAPI_API_TOKEN: ${{ secrets.BRAPI_API_TOKEN }}
        run: node --import tsx scripts/sync.ts
